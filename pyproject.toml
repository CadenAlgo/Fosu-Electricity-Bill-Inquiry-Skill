[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fosu-campus-agent"
version = "0.1.0"
description = "Local Codex Skill for Foshan University dormitory electricity queries"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["fosu_campus_agent*", "clients*", "reports*"]
